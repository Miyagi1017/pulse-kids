<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fredoka";
        src: url("assets/fonts/fredoka-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      :root {
        --ink: #47386b;
        --soft: #6f6191;
        --coral: #d84a78;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #ffe9f3;
      }
      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        background: linear-gradient(180deg, #ffe9f3 0%, #f3ecff 50%, #fff6fb 100%);
      }
      #sun {
        position: absolute;
        left: 560px;
        top: 96px;
        width: 160px;
        height: 160px;
      }
      #sun-rays {
        position: absolute;
        inset: -30px;
      }
      #sun-disc {
        position: absolute;
        inset: 0;
      }
      #logo {
        position: absolute;
        left: 0;
        right: 0;
        top: 306px;
        display: flex;
        justify-content: center;
        gap: 4px;
        font-size: 128px;
        line-height: 1;
        color: var(--ink);
      }
      #logo .letter {
        display: inline-block;
      }
      #logo .kids {
        color: var(--coral);
      }
      #logo .gap {
        width: 36px;
      }
      #tagline {
        position: absolute;
        left: 0;
        right: 0;
        top: 462px;
        text-align: center;
        font-size: 44px;
        color: var(--soft);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1280" data-height="720">
      <div id="sun" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <svg id="sun-rays" viewBox="-110 -110 220 220">
          <g fill="#ffd76a">
            <rect x="-9" y="-108" width="18" height="36" rx="9" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(45)" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(90)" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(135)" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(180)" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(225)" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(270)" />
            <rect x="-9" y="-108" width="18" height="36" rx="9" transform="rotate(315)" />
          </g>
        </svg>
        <svg id="sun-disc" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="74" fill="#ffe48f" />
          <ellipse cx="56" cy="72" rx="9" ry="11" fill="#47386b" />
          <ellipse cx="104" cy="72" rx="9" ry="11" fill="#47386b" />
          <circle cx="59" cy="68" r="3.4" fill="#fff" />
          <circle cx="107" cy="68" r="3.4" fill="#fff" />
          <ellipse cx="36" cy="94" rx="12" ry="7" fill="#ff8fb1" opacity="0.65" />
          <ellipse cx="124" cy="94" rx="12" ry="7" fill="#ff8fb1" opacity="0.65" />
          <path d="M66 94 Q80 110 94 94" stroke="#47386b" stroke-width="5" fill="none" stroke-linecap="round" />
        </svg>
      </div>

      <div id="logo" class="clip" data-start="0" data-duration="2.5" data-track-index="2">
        <span class="letter">P</span><span class="letter">u</span><span class="letter">l</span><span class="letter">s</span><span class="letter">e</span>
        <span class="gap"></span>
        <span class="letter kids">K</span><span class="letter kids">i</span><span class="letter kids">d</span><span class="letter kids">s</span>
      </div>

      <div id="tagline" class="clip" data-start="0.9" data-duration="1.6" data-track-index="3">On bouge ensemble&#8239;!</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Le soleil tombe, s'écrase un peu, puis se pose.
      tl.fromTo("#sun", { y: -340 }, { y: 0, duration: 0.5, ease: "power2.in" }, 0);
      tl.to("#sun-disc", { scaleX: 1.16, scaleY: 0.82, duration: 0.09, ease: "power1.out", transformOrigin: "50% 100%" }, 0.5);
      tl.to("#sun-disc", { scaleX: 1, scaleY: 1, duration: 0.42, ease: "elastic.out(1.1, 0.4)", transformOrigin: "50% 100%" }, 0.59);
      tl.fromTo("#sun-rays", { rotation: 0 }, { rotation: 150, duration: 2.5, ease: "none", transformOrigin: "50% 50%" }, 0);

      // Le choc fait sauter les lettres, une par une.
      tl.fromTo(
        "#logo .letter",
        { y: 70, scale: 0, transformOrigin: "50% 100%" },
        { y: 0, scale: 1, duration: 0.5, ease: "back.out(2.4)", stagger: 0.05 },
        0.5
      );

      tl.fromTo("#tagline", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.05);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
